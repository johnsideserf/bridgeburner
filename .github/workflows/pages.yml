name: Deploy game to GitHub Pages
on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test the browser engine and bots
        run: cd web && npm test
      - name: Stage site (game only, no test fixtures)
        run: mkdir -p site && cp web/*.html web/*.css web/*.js site/
      - name: Cache-bust asset URLs with the commit SHA
        run: |
          V=${GITHUB_SHA::7}
          sed -i "s#\(app\.js\|style\.css\)\"#\1?v=$V\"#g" site/index.html
          sed -i "s#'\./\(engine\|bots\|strategies\)\.js'#'./\1.js?v=$V'#g; s#'worker\.js'#'worker.js?v=$V'#g" site/*.js
          grep -o "v=$V" site/index.html site/app.js site/worker.js site/bots.js | sort | uniq -c
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
